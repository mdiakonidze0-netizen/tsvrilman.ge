<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login — წვრილმანი</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<main class="section">

    <div class="admin-login-box">

        <h1>
            👨‍💼 Manager Login
        </h1>

        <p>
            შესვლა მხოლოდ ადმინისტრატორისთვის
        </p>

        <br>

        <form id="adminLoginForm">

            <label>
                ელფოსტა

                <input
                    type="email"
                    id="adminEmail"
                    required
                >
            </label>

            <br>

            <label>
                პაროლი

                <input
                    type="password"
                    id="adminPassword"
                    required
                >
            </label>

            <br>

            <button
                type="submit"
                class="primary-button"
            >
                შესვლა
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</main>


    <script src="js/orders.js"></script>
<script src="js/admin-orders.js"></script>

</body>

</html>
