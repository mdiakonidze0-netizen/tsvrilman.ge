<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Settings — წვრილმანი</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="header">

    <a
        href="admin.html"
        class="logo"
    >
        ← Manager
    </a>

    <h2>
        🚚 მიწოდების პარამეტრები
    </h2>

</header>


<main class="section">

    <h1>
        მიწოდების მართვა
    </h1>

    <p>
        აქედან შეძლებ მიწოდების ტიპებისა და
        ქვეყნების მართვას.
    </p>


    <!-- STANDARD DELIVERY -->

    <section class="admin-card">

        <h2>
            📦 სტანდარტული მიწოდება
        </h2>

        <label>

            <input
                type="checkbox"
                id="standardEnabled"
            >

            ჩართულია

        </label>

        <br><br>

        <label>
            ფასი
        </label>

        <input
            type="number"
            id="standardPrice"
            min="0"
            step="0.01"
        >

        <br><br>

        <button
            class="primary-button"
            id="saveStandard"
        >
            შენახვა
        </button>

    </section>


    <br>


    <!-- EXPRESS DELIVERY -->

    <section class="admin-card">

        <h2>
            ⚡ სწრაფი მიწოდება
        </h2>

        <label>

            <input
                type="checkbox"
                id="expressEnabled"
            >

            ჩართულია

        </label>

        <br><br>

        <label>
            ფასი
        </label>

        <input
            type="number"
            id="expressPrice"
            min="0"
            step="0.01"
        >

        <br><br>

        <button
            class="primary-button"
            id="saveExpress"
        >
            შენახვა
        </button>

    </section>


    <br>


    <!-- COUNTRIES -->

    <section class="admin-card">

        <h2>
            🌍 ხელმისაწვდომი ქვეყნები
        </h2>

        <p>
            მონიშნე ქვეყნები, სადაც მიწოდება
            ხელმისაწვდომია.
        </p>

        <div id="countryList"></div>

        <br>

        <button
            class="primary-button"
            id="saveCountries"
        >
            ქვეყნების შენახვა
        </button>

    </section>


    <br>

    <p id="deliveryMessage"></p>

</main>


<script src="js/delivery.js"></script>
<script src="js/delivery-settings.js"></script>

</body>

</html>
