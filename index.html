<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>წვრილმანი</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #2563eb;
        }

        .hero {
            max-width: 1200px;
            margin: 30px auto;
            padding: 80px 30px;
            border-radius: 25px;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        .products {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .empty {
            min-height: 250px;
            border: 2px dashed #ccc;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            text-align: center;
            background: white;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        წვრილ<span>მანი</span>
    </div>

    <div>
        🛒 კალათა
    </div>

</header>


<section class="hero">

    <h1>
        კეთილი იყოს შენი მობრძანება წვრილმანში
    </h1>

    <p>
        შენი ონლაინ მაღაზია იწყება აქ.
    </p>

</section>


<section class="products">

    <h2>
        პროდუქტები
    </h2>

    <div class="empty">

        <div>

            <div style="font-size:60px;">
                🛍️
            </div>

            <h3>
                პროდუქტები მალე დაემატება
            </h3>

            <p>
                აქ განთავსდება შენი პროდუქცია.
            </p>

        </div>

    </div>

</section>


<footer>

    © 2026 წვრილმანი

</footer>
<script src="js/age-check.js"></script>
</body>
</html>
